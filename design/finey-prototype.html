:root{--s:1;--bz:12px;--fy-bg:#0B0B0D;--fy-panel:#0E0E11;--fy-line:#18181C;--fy-text:#F4F4F6;--fy-muted:#A6A6B0;--fy-faint:#8A8A95;--fy-iris:#7B6CF6;--fy-lilac:#A59BFF}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;height:100%;background:var(--fy-bg)}
body{overflow:hidden;font-family:'Archivo',system-ui,sans-serif;color:var(--fy-text)}
#app{height:100%}
.fy-root{display:flex;height:100%}
.fy-panel{width:320px;flex-shrink:0;height:100%;overflow-y:auto;box-sizing:border-box;padding:28px 20px 24px;background:var(--fy-panel);box-shadow:inset -1px 0 0 var(--fy-line);display:flex;flex-direction:column;gap:20px;scrollbar-width:thin;scrollbar-color:#2A2A31 transparent}
.fy-brand{display:flex;align-items:center;gap:12px;padding:0 4px}
.fy-mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(180deg,#6F5EF0,#5240D9);box-shadow:inset 0 1px 0 rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;color:#FFFFFF;font-weight:700;font-size:17px;font-stretch:125%;font-variation-settings:'wdth' 125}
.fy-brand b{display:block;font-size:17px;font-weight:600;font-stretch:125%;font-variation-settings:'wdth' 125}
.fy-brand-sub{display:block;margin-top:2px;font-size:13px;color:var(--fy-faint)}
.fy-intro{margin:0;padding:0 4px;font-size:14px;line-height:1.5;color:var(--fy-muted)}
.fy-ctrl{display:flex;gap:8px;padding:0 4px}
.fy-btn{height:40px;padding:0 14px;border:0;border-radius:20px;background:#17171B;color:var(--fy-text);font:inherit;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:8px;cursor:pointer;transition:background-color .15s ease,opacity .2s ease,transform .12s ease}
.fy-btn:hover{background:#1E1E24}
.fy-btn:active{transform:scale(.97)}
.fy-btn:disabled{opacity:.4;cursor:default;transform:none;background:#17171B}
.fy-btn:focus-visible,.fy-nav:focus-visible{outline:2px solid var(--fy-lilac);outline-offset:2px}
.fy-list{display:flex;flex-direction:column;gap:18px}
.fy-group h3{margin:0 0 6px;padding:0 8px;font-size:12px;font-weight:600;color:var(--fy-faint)}
.fy-group ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.fy-nav{position:relative;width:100%;height:36px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:var(--fy-muted);font:inherit;font-size:14px;font-weight:500;text-align:left;cursor:pointer;display:flex;align-items:center;transition:background-color .15s ease,color .15s ease}
.fy-nav:hover{background:#141417;color:var(--fy-text)}
.fy-nav.on{background:rgba(123,108,246,.14);color:var(--fy-text)}
.fy-nav.on::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--fy-iris)}
.fy-foot{margin:auto 0 0;padding:12px 4px 0;font-size:12px;line-height:1.5;color:var(--fy-faint)}
.fy-stage{flex:1;min-width:0;height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(60% 50% at 50% 45%,rgba(123,108,246,.07),rgba(123,108,246,0) 70%),var(--fy-bg)}
.fy-devwrap{width:calc((412px + 2 * var(--bz)) * var(--s));height:calc((915px + 2 * var(--bz)) * var(--s));flex-shrink:0}
.fy-dev{position:relative;width:412px;height:915px;border:var(--bz) solid #1A1A1F;border-radius:56px;background:#000;box-shadow:0 0 0 1px #26262D,0 40px 90px rgba(0,0,0,.55);transform:scale(var(--s));transform-origin:0 0}
.fy-cam{position:absolute;top:12px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:6px;background:#000;box-shadow:inset 0 0 0 2px #15151A;z-index:20;pointer-events:none}
.fy-vp{position:relative;width:412px;height:915px;overflow:hidden;border-radius:44px;background:#08080A;isolation:isolate}
.fy-scr{position:absolute;left:0;top:0;width:412px;height:915px}
.fy-in-fwd{z-index:2;animation:fy-in-fwd .38s cubic-bezier(.2,0,0,1) both}
.fy-out-fwd{z-index:1;pointer-events:none;animation:fy-out-fwd .3s cubic-bezier(.3,0,.8,.15) both}
.fy-in-back{z-index:2;animation:fy-in-back .38s cubic-bezier(.2,0,0,1) both}
.fy-out-back{z-index:1;pointer-events:none;animation:fy-out-back .3s cubic-bezier(.3,0,.8,.15) both}
.fy-in-tab{z-index:2;animation:fy-in-tab .3s cubic-bezier(.2,0,0,1) .08s both}
.fy-out-tab{z-index:1;pointer-events:none;animation:fy-out-tab .14s ease both}
.fy-in-none{z-index:2}
@keyframes fy-in-fwd{from{opacity:0;transform:translateX(72px)}}
@keyframes fy-out-fwd{to{opacity:0;transform:translateX(-72px)}}
@keyframes fy-in-back{from{opacity:0;transform:translateX(-72px)}}
@keyframes fy-out-back{to{opacity:0;transform:translateX(72px)}}
@keyframes fy-in-tab{from{opacity:0;transform:scale(.985)}}
@keyframes fy-out-tab{to{opacity:0}}
.fy-mobile{--bz:0px}
.fy-top{display:none}
.fy-scrim{display:none}
.fy-mobile .fy-root{flex-direction:column}
.fy-mobile .fy-top{display:flex;align-items:center;justify-content:space-between;gap:8px;height:52px;padding:0 10px;box-sizing:border-box;background:var(--fy-panel);box-shadow:inset 0 -1px 0 var(--fy-line);flex-shrink:0}
.fy-mobile .fy-top-title{flex:1;min-width:0;text-align:center;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fy-mobile .fy-stage{background:#08080A;align-items:flex-start}
.fy-mobile .fy-dev{border:0;border-radius:0;box-shadow:none}
.fy-mobile .fy-vp{border-radius:0}
.fy-mobile .fy-cam{display:none}
.fy-mobile .fy-panel{position:fixed;left:0;top:0;bottom:0;width:min(320px,86vw);z-index:40;transform:translateX(-102%);transition:transform .3s cubic-bezier(.2,0,0,1);box-shadow:inset -1px 0 0 var(--fy-line),20px 0 60px rgba(0,0,0,.5)}
.fy-mobile .fy-panel.open{transform:none}
.fy-mobile .fy-scrim{display:block;position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s ease}
.fy-mobile .fy-scrim.open{opacity:1;pointer-events:auto}
@media (prefers-reduced-motion: reduce){.fy-scr{animation:none!important}.fy-panel{transition:none!important}}

/* ---------- Screens (each board's styles, scoped to its own screen) ---------- */
/* V4-Home */
.scr-V4-Home{margin:0}
.scr-V4-Home a{color:#A59BFF}
.scr-V4-Home a:hover{color:#C8C1FF}
.scr-V4-Home .n{font-variant-numeric:tabular-nums}
.scr-V4-Home .w{font-stretch:125%;font-variation-settings:'wdth' 125}
.scr-V4-Home button{font:inherit;color:inherit;cursor:pointer}
.scr-V4-Home button:focus-visible,.scr-V4-Home a:focus-visible,.scr-V4-Home input:focus-visible{outline:2px solid #A59BFF;outline-offset:2px}
.scr-V4-Home input{font:inherit;color:inherit}
.scr-V4-Home input::placeholder{color:#8A8A95}
.scr-V4-Home .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.scr-V4-Home .ib{width:44px;height:44px;border:0;border-radius:22px;background:#141417;color:#F4F4F6;display:flex;align-items:center;justify-content:center}
.scr-V4-Home .ib:hover{color:#F4F4F6}
.scr-V4-Home .press{transition:transform .12s cubic-bezier(.2,.8,.2,1),background-color .15s ease}
.scr-V4-Home .press:active{transform:scale(.94)}
.scr-V4-Home .amt{transition:filter .25s ease}
.scr-V4-Home .hid .amt{filter:blur(9px)}
.scr-V4-Home .eye{display:flex;animation:kV4Home_spin .26s cubic-bezier(.2,.8,.2,1) both}
@keyframes kV4Home_spin{from{opacity:0;transform:rotate(-35deg) scale(.7)}}
.scr-V4-Home .tk line{stroke-dasharray:60;animation:kV4Home_grow .42s cubic-bezier(.2,.8,.2,1) both}
@keyframes kV4Home_grow{from{stroke-dashoffset:60;opacity:0}30%{opacity:1}to{stroke-dashoffset:0;opacity:1}}

.scr-V4-Holding .tag{height:28px;padding:0 10px;border-radius:14px;background:#141417;display:flex;align-items:center;font-size:12px;font-weight:600;color:#D9D9DE}

@keyframes kV4Holding_spin{to{transform:rotate(360deg)}}
.scr-V4-Holding .bar{height:10px;border-radius:5px;transform-origin:0 50%;animation:kV4Holding_bar .9s cubic-bezier(.2,.8,.2,1) both;transition:width .5s cubic-bezier(.2,.8,.2,1)}

.scr-V4-Holding .cta{height:52px;border:0;border-radius:26px;background:linear-gradient(180deg,#6F5EF0,#5240D9);box-shadow:inset 0 1px 0 rgba(255,255,255,.16);color:#FFFFFF;font-size:15px;font-weight:600;transition:opacity .2s ease,transform .12s ease}

window.__FINEY_CODE__["V4-Home"]=function(DCLogic){
class Component extends DCLogic {
  componentDidMount() {
    var self = this;
    var reduce = false;
    try { reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) {}
    if (reduce) { this.setState({ p: 1 }); return; }
    var start = null;
    var step = function (t) {
      if (start === null) { start = t; }
      var x = Math.min(Math.max((t - start - 120) / 980, 0), 1);
      self.setState({ p: 1 - Math.pow(1 - x, 3) });
      if (x < 1) { self.raf = requestAnimationFrame(step); }
    };
    this.raf = requestAnimationFrame(step);
  }
  componentWillUnmount() {
    if (this.raf) { cancelAnimationFrame(this.raf); }
  }
  renderVals() {
    var s = this.state || {};
    var hidden = !!s.hidden;
    var p = (typeof s.p === 'number') ? s.p : 0;
    var self = this;
    return {
      hidden: hidden,
      shown: !hidden,
      privacyClass: hidden ? 'hid' : '',
      eyeLabel: hidden ? 'Show amounts' : 'Hide amounts',
      balance: '₹' + Math.round(56260 * p).toLocaleString('en-IN'),
      togglePrivacy: function () { self.setState({ hidden: !hidden }); }
    };
  }
}
return Component;
};
window.__FINEY_CODE__["V4-Locked"]=function(DCLogic){
class Component extends DCLogic {
  componentWillUnmount() {
    if (this.tm) { clearTimeout(this.tm); }
  }
  press(d) {
    var s = this.state || {};
    if (s.status === 'ok' || s.busy) { return; }
    var pin = (s.pin || '') + d;
    var self = this;
    if (pin.length < 5) { this.setState({ pin: pin, status: 'idle' }); return; }
    this.setState({ pin: pin, status: 'idle', busy: true });
    this.tm = setTimeout(function () {
      if (pin === '12345') { self.setState({ status: 'ok', busy: false }); }
      else { self.setState({ pin: '', status: 'error', flip: !self.state.flip, busy: false }); }
    }, 180);
  }
  renderVals() {
    var s = this.state || {};
    var self = this;
    var pin = s.pin || '';
    var status = s.status || 'idle';
    var ok = status === 'ok';
    var dots = [];
    for (var i = 0; i < 5; i++) { dots.push({ cls: i < pin.length ? 'pd on' : 'pd' }); }
    var vals = {
      locked: !ok,
      unlocked: ok,
      rootClass: ok ? 'open' : '',
      eyeBg: ok ? '#141417' : 'rgba(123,108,246,.18)',
      eyeColor: ok ? '#F4F4F6' : '#A59BFF',
      message: status === 'error' ? "That PIN didn't match. Try again." : 'Enter your PIN to show them.',
      msgClass: status === 'error' ? 'err' : '',
      dots: dots,

          return h('li', { key: id }, h('button', { class: on ? 'fy-nav on' : 'fy-nav', 'aria-current': on ? 'page' : undefined, onClick: function () { self.jump(id); } }, byId[id].title));
        }))
      ]);
    });
    return h('aside', { class: st.menu ? 'fy-panel open' : 'fy-panel', 'aria-label': 'Screens' }, [
      h('div', { class: 'fy-brand' }, [h('span', { class: 'fy-mark', 'aria-hidden': 'true' }, 'F'), h('div', null, [h('b', null, 'Finey'), h('span', { class: 'fy-brand-sub' }, 'Android prototype, version 4')])]),
      h('p', { class: 'fy-intro' }, 'Everything here is clickable. Use it like the app, or jump straight to any screen below.'),
      h('div', { class: 'fy-ctrl' }, [
        h('button', { class: 'fy-btn', disabled: st.idx === 0, onClick: function () { self.back(); } }, [ICON_BACK, 'Back']),
        h('button', { class: 'fy-btn', onClick: function () { self.restart(); } }, [ICON_RESTART, 'Restart screen'])
      ]),
      h('nav', { class: 'fy-list', 'aria-label': 'All screens' }, groups),
      h('p', { class: 'fy-foot' }, DATA.screens.length + ' screens with sample data for October 2026. Your browser back button works too.')
    ]);
  };
  App.prototype.render = function () {
    var self = this;
    var st = this.state;
    var screen = function (o, cls, extra) {
      var props = { key: o.key, class: 'fy-scr scr-' + o.id + ' ' + cls };
      Object.keys(extra || {}).forEach(function (k) { props[k] = extra[k]; });
      return h('div', props, h(screenClass(o.id), null));
    };
    var shown = [];
    if (st.prev) { shown.push(screen(st.prev, 'fy-out-' + st.anim, { inert: true, 'aria-hidden': 'true' })); }
    shown.push(screen(st.cur, 'fy-in-' + st.anim, null));
    return h('div', { class: 'fy-root' }, [
      h('header', { class: 'fy-top' }, [
        h('button', { class: 'fy-btn', 'aria-expanded': st.menu ? 'true' : 'false', onClick: function () { self.setState({ menu: !st.menu }); } }, [ICON_MENU, 'Screens']),
        h('span', { class: 'fy-top-title' }, byId[st.cur.id].title),
        h('button', { class: 'fy-btn', 'aria-label': 'Back', disabled: st.idx === 0, onClick: function () { self.back(); } }, ICON_BACK)
      ]),
      h('div', { class: st.menu ? 'fy-scrim open' : 'fy-scrim', onClick: function () { self.setState({ menu: false }); } }),
      this.renderPanel(),
      h('main', { class: 'fy-stage' }, h('div', { class: 'fy-devwrap' }, h('div', { class: 'fy-dev' }, [
        h('span', { class: 'fy-cam', 'aria-hidden': 'true' }),
        h('div', { class: 'fy-vp', onClickCapture: this.onClick }, shown)
      ])))
    ]);
  };

  preact.render(h(App, null), document.getElementById('app'));
})();
</script>
