<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Finey · Ledger calendar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap">
<style>
body{margin:0}
a{color:#A59BFF}a:hover{color:#C8C1FF}
.n{font-variant-numeric:tabular-nums}
.w{font-stretch:125%;font-variation-settings:'wdth' 125}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid #A59BFF;outline-offset:2px}
.ib{width:44px;height:44px;border:0;border-radius:22px;background:#141417;color:#F4F4F6;display:flex;align-items:center;justify-content:center;transition:transform .12s ease}
.ib:active{transform:scale(.94)}
.ib:hover{color:#F4F4F6}
.tab{position:relative;height:44px;display:flex;align-items:center;color:#8A8A95;font-size:15px;font-weight:500;text-decoration:none}
.tab.on{color:#F4F4F6}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;background:#7B6CF6}
.d{position:relative;height:46px;border:0;border-radius:14px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#F4F4F6;font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;transition:background-color .18s ease,box-shadow .18s ease,transform .12s cubic-bezier(.2,.8,.2,1)}
.d:not(:disabled):active{transform:scale(.92)}
.d small{font-size:10px;font-weight:500;color:#B4B4BE}
.d i{position:absolute;top:6px;right:7px;width:5px;height:5px;border-radius:3px;background:#5EE0A1}
.h1{background:rgba(123,108,246,.10)}.h2{background:rgba(123,108,246,.20)}.h3{background:rgba(123,108,246,.34)}.h4{background:rgba(123,108,246,.55)}
.h4 small{color:#E9E6FF}
.td{box-shadow:inset 0 0 0 1.5px #A59BFF}
.d.sel{background:linear-gradient(180deg,#6F5EF0,#5240D9);box-shadow:inset 0 1px 0 rgba(255,255,255,.16)}
.d.sel small{color:#F1EFFF}
.o{color:#34343C;cursor:default}
.f{color:#5C5C66;cursor:default}
.dA{animation:dA .26s cubic-bezier(.2,.8,.2,1) both}
.dB{animation:dB .26s cubic-bezier(.2,.8,.2,1) both}
@keyframes dA{from{opacity:0;transform:translateY(8px)}}
@keyframes dB{from{opacity:0;transform:translateY(8px)}}
.r{display:flex;align-items:center;gap:14px;height:56px;color:#F4F4F6;text-decoration:none;border-radius:14px;transition:background-color .15s ease}
.r:hover{color:#F4F4F6}
.r:active{background:#111114}
.gl{width:38px;height:38px;border-radius:19px;background:#141417;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tb{position:absolute;left:0;right:0;bottom:0;height:76px;background:#08080A;box-shadow:inset 0 1px 0 rgba(255,255,255,.06);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-bottom:8px;box-sizing:border-box}
.ti{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#8A8A95;font-size:11px;font-weight:500;text-decoration:none}
.ti.on{color:#F4F4F6}
.ti.on svg{color:#A59BFF}
.ti.on::before{content:"";position:absolute;top:0;left:50%;width:20px;margin-left:-10px;height:3px;border-radius:0 0 3px 3px;background:#7B6CF6}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:1ms!important}}
</style>
</helmet>
<div style="width: 412px; height: 915px; position: relative; overflow: hidden; background: #08080A; color: #F4F4F6; font-family: 'Archivo', system-ui, sans-serif; box-sizing: border-box; padding-top: 36px">

  <header style="height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px">
    <h1 class="w" style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.01em">Ledger</h1>
    <div style="display: flex; gap: 8px">
      <a class="ib" href="V4-Month.dc.html" aria-label="Change month, October 2026"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"></rect><path d="M8 3v4M16 3v4M3.5 10h17"></path></svg></a>
      <a class="ib" href="V4-Capture.dc.html" aria-label="Add an entry" style="background: linear-gradient(180deg, #6F5EF0, #5240D9); box-shadow: inset 0 1px 0 rgba(255,255,255,.16); color: #FFFFFF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
    </div>
  </header>

  <nav aria-label="Ledger view" style="display: flex; gap: 28px; padding: 0 20px; box-shadow: inset 0 -1px 0 #1A1A1F">
    <a class="tab" href="V4-Ledger.dc.html">List</a>
    <a class="tab on" href="V4-Calendar.dc.html" aria-current="page">Calendar</a>
  </nav>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 16px 20px 0">
    <div style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 12px; color: #8A8A95">Money in</span><span class="w n" style="font-size: 15px; font-weight: 600; color: #5EE0A1">₹1,24,500</span></div>
    <div style="display: flex; flex-direction: column; gap: 3px; padding-left: 14px; box-shadow: inset 1px 0 0 #1A1A1F"><span style="font-size: 12px; color: #8A8A95">Money out</span><span class="w n" style="font-size: 15px; font-weight: 600">₹68,240</span></div>
    <div style="display: flex; flex-direction: column; gap: 3px; padding-left: 14px; box-shadow: inset 1px 0 0 #1A1A1F"><span style="font-size: 12px; color: #8A8A95">Net</span><span class="w n" style="font-size: 15px; font-weight: 600">+₹56,260</span></div>
  </div>

  <div style="padding: 12px 14px 0">
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); height: 24px; align-items: center; text-align: center; font-size: 12px; color: #8A8A95"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
    <div role="grid" aria-label="October 2026, days shaded by how much you spent" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px 4px">
      <sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
        <button class="{{c.cls}}" disabled="{{c.dis}}" aria-pressed="{{c.sel}}" aria-label="{{c.aria}}" onClick="{{c.pick}}"><sc-if value="{{c.inc}}" hint-placeholder-val="{{ false }}"><i></i></sc-if>{{c.label}}<sc-if value="{{c.hasAmt}}" hint-placeholder-val="{{ true }}"><small>{{c.small}}</small></sc-if></button>
      </sc-for>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding: 0 6px; font-size: 11px; color: #8A8A95">
      <span style="display: flex; align-items: center; gap: 6px"><i style="width: 6px; height: 6px; border-radius: 3px; background: #5EE0A1"></i>Money came in</span>
      <span style="display: flex; align-items: center; gap: 5px">Less<i style="width: 12px; height: 12px; border-radius: 4px; background: rgba(123,108,246,.10)"></i><i style="width: 12px; height: 12px; border-radius: 4px; background: rgba(123,108,246,.20)"></i><i style="width: 12px; height: 12px; border-radius: 4px; background: rgba(123,108,246,.34)"></i><i style="width: 12px; height: 12px; border-radius: 4px; background: rgba(123,108,246,.55)"></i>More spent</span>
    </div>
  </div>

  <section class="{{detailClass}}" aria-live="polite" style="margin: 18px 20px 0; padding-top: 16px; box-shadow: inset 0 1px 0 #1A1A1F">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <h2 class="w" style="margin: 0; font-size: 17px; font-weight: 600">{{dayTitle}}</h2>
      <span class="w n" style="font-size: 17px; font-weight: 600; color: {{netColor}}">{{dayNet}}</span>
    </div>
    <p style="margin: 4px 0 6px; font-size: 13px; color: #8A8A95">{{daySub}}</p>
    <sc-for list="{{entries}}" as="e" hint-placeholder-count="3">
      <a class="r" href="V4-Entry.dc.html"><span class="gl" style="color: {{e.color}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{e.d}}"></path></svg></span><div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">{{e.name}}</span><span style="font-size: 13px; color: #8A8A95">{{e.cat}}</span></div><span class="n" style="font-size: 15px; font-weight: 500">{{e.amt}}</span></a>
    </sc-for>
    <sc-if value="{{noEntries}}" hint-placeholder-val="{{ false }}">
      <a href="V4-Ledger.dc.html" style="display: inline-flex; margin-top: 8px; font-size: 14px; font-weight: 500; text-decoration: none">See this day's entries in the list</a>
    </sc-if>
  </section>

  <nav class="tb" aria-label="Main">
    <a class="ti" href="V4-Home.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
    <a class="ti" href="V4-Spending.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9h-9z"></path><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"></path></svg>Spending</a>
    <a class="ti on" href="V4-Ledger.dc.html" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"></path></svg>Ledger</a>
    <a class="ti" href="V4-People.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M3 20c.8-3.4 3.2-5 6-5s5.2 1.6 6 5M16 4.5a3.5 3.5 0 0 1 0 7M18 15c1.6.6 2.6 2.2 3 5"></path></svg>People</a>
    <a class="ti" href="V4-Wealth.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 17 6-6 4 4 8-8M15 7h6v6"></path></svg>Wealth</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var s = this.state || {};
    var sel = s.sel || 19;
    var EXP = [1450, 2980, 14446, 5200, 2310, 1240, 3890, 640, 2100, 4720, 3360, 980, 1750, 2890, 6420, 2210, 1520, 1860, 5170, 2618, 486];
    var INC = { 1: 110000, 14: 14500 };
    var FORK = 'M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 21V3c-2 1.5-3 4-3 7h3';
    var ENTRIES = {
      21: [{ name: 'Swiggy dinner', cat: 'Food & Dining', amt: '−₹486', color: '#F2A272', d: FORK }],
      20: [
        { name: 'Electricity bill', cat: 'Utilities', amt: '−₹2,140', color: '#6FB2FF', d: 'M13 2 4 14h7l-1 8 9-12h-7z' },
        { name: 'Uber to office', cat: 'Transportation', amt: '−₹238', color: '#5CD3C6', d: 'M5 16V11l2-5h10l2 5v5M3 16h18v3H3zM5 11h14' },
        { name: 'BigBasket top-up', cat: 'Food & Dining', amt: '−₹240', color: '#F2A272', d: FORK }
      ],
      19: [
        { name: 'Headphones', cat: 'Shopping', amt: '−₹3,499', color: '#F08DBA', d: 'M5 8h14l-1 13H6zM9 8V6a3 3 0 0 1 6 0v2' },
        { name: 'Gym, monthly', cat: 'Health', amt: '−₹1,200', color: '#FF8A80', d: 'M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z' },
        { name: 'Chai and snacks', cat: 'Food & Dining', amt: '−₹471', color: '#F2A272', d: FORK }
      ]
    };
    var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    var fmt = function (v) { return v.toLocaleString('en-IN'); };
    var compact = function (v) { return v < 1000 ? String(v) : (v / 1000).toFixed(1) + 'k'; };
    var heat = function (v) { return v < 1000 ? 'h1' : v < 3000 ? 'h2' : v < 6000 ? 'h3' : 'h4'; };
    var cells = [];
    [27, 28, 29, 30].forEach(function (d) {
      cells.push({ label: String(d), cls: 'd o', dis: true, sel: false, inc: false, hasAmt: false, small: '', aria: d + ' September', pick: null });
    });
    for (var day = 1; day <= 31; day++) {
      (function (d) {
        var past = d <= 21;
        var out = past ? EXP[d - 1] : 0;
        var cls = 'd';
        if (!past) { cls += ' f'; }
        else if (d === sel) { cls += ' sel'; }
        else { cls += ' ' + heat(out); }
        if (d === 21 && d !== sel) { cls += ' td'; }
        cells.push({
          label: String(d), cls: cls, dis: !past, sel: d === sel, inc: !!INC[d], hasAmt: past, small: past ? compact(out) : '',
          aria: DAYS[(4 + d - 1) % 7] + ' ' + d + ' October' + (past ? ', ₹' + fmt(out) + ' spent' : ''),
          pick: past ? function () { if (d !== sel) { self.setState({ sel: d, flip: !s.flip }); } } : null
        });
      })(day);
    }
    var out = EXP[sel - 1];
    var inn = INC[sel] || 0;
    var net = inn - out;
    var list = ENTRIES[sel] || [];
    var known = list.length > 0;
    var inText = inn ? '₹' + fmt(inn) + ' came in' : 'nothing came in';
    return {
      cells: cells,
      detailClass: s.flip === undefined ? '' : (s.flip ? 'dA' : 'dB'),
      dayTitle: DAYS[(4 + sel - 1) % 7] + ' ' + sel + ' Oct',
      dayNet: (net >= 0 ? '+₹' : '−₹') + fmt(Math.abs(net)),
      netColor: net >= 0 ? '#5EE0A1' : '#F4F4F6',
      daySub: known ? (list.length + (list.length === 1 ? ' entry, ' : ' entries, ') + inText) : ('₹' + fmt(out) + ' spent, ' + inText),
      entries: list,
      noEntries: !known
    };
  }
}
</script>
</body>
</html>
