<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Finey · Edit entry</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap">
<style>
body{margin:0}
a{color:#A59BFF}a:hover{color:#C8C1FF}
.n{font-variant-numeric:tabular-nums}
.w{font-stretch:125%;font-variation-settings:'wdth' 125}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
input::placeholder{color:#8A8A95}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #A59BFF;outline-offset:2px}
.tab{width:96px;height:44px;border:0;background:transparent;padding:0;font-size:15px;font-weight:500;color:#8A8A95;transition:color .2s ease}
.tab.on{color:#F4F4F6}
.ind{position:absolute;left:20px;bottom:0;width:96px;height:2px;border-radius:2px;background:#7B6CF6;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.cc{height:44px;padding:0 16px 0 6px;border:0;border-radius:22px;background:#141417;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;white-space:nowrap;flex-shrink:0;color:#D9D9DE;transition:background-color .18s ease,box-shadow .18s ease,color .18s ease,transform .12s ease}
.cc:active{transform:scale(.96)}
.cc.on{background:rgba(123,108,246,.2);box-shadow:inset 0 0 0 1.5px #7B6CF6;color:#F4F4F6}
.cc i{width:32px;height:32px;border-radius:16px;background:#1C1C21;display:flex;align-items:center;justify-content:center}
.cA{animation:slideA .26s cubic-bezier(.2,.8,.2,1) both}
.cB{animation:slideB .26s cubic-bezier(.2,.8,.2,1) both}
@keyframes slideA{from{opacity:0;transform:translateX(14px)}}
@keyframes slideB{from{opacity:0;transform:translateX(14px)}}
.bA{animation:bumpA .18s cubic-bezier(.2,.8,.2,1)}
.bB{animation:bumpB .18s cubic-bezier(.2,.8,.2,1)}
@keyframes bumpA{from{transform:scale(1.045)}}
@keyframes bumpB{from{transform:scale(1.045)}}
.grp{border-radius:20px;background:#111114;transition:box-shadow .18s ease}
.dr{display:flex;align-items:center;gap:14px;height:56px;padding:0 16px;color:#F4F4F6;text-decoration:none}
.dr+.dr{box-shadow:inset 0 1px 0 #1A1A1F}
.dr:focus-within{background:#141417;border-radius:20px 20px 0 0}
.k{height:58px;border:0;border-radius:29px;background:transparent;color:#F4F4F6;font-size:24px;font-weight:500;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;transition:background-color .14s ease,transform .12s cubic-bezier(.2,.8,.2,1)}
.k:active{background:#141417;transform:scale(.94)}
.cta{height:56px;border:0;border-radius:28px;width:100%;background:linear-gradient(180deg,#6F5EF0,#5240D9);box-shadow:inset 0 1px 0 rgba(255,255,255,.16);color:#FFFFFF;font-size:16px;font-weight:600;transition:opacity .2s ease,transform .12s ease}
.cta:active{transform:scale(.98)}
.cta.off{opacity:.38;cursor:not-allowed}
.hint{animation:fade .24s ease both}
.was{animation:rise .28s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(-4px)}}
@keyframes fade{from{opacity:0}}
@keyframes blink{50%{opacity:0}}
.caret{animation:blink 1.1s steps(1) infinite}
.scrim{animation:fade .3s ease both}
.up{animation:up .4s cubic-bezier(.3,.7,.2,1) both}
@keyframes up{from{transform:translateY(100%)}}
.ck circle,.ck path{stroke-dasharray:1;animation:draw .5s cubic-bezier(.4,0,.2,1) both}
.ck circle{animation-delay:.2s}
.ck path{animation-delay:.55s;animation-duration:.32s}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:1ms!important}}
</style>
</helmet>
<div style="width: 412px; height: 915px; position: relative; overflow: hidden; background: #08080A; color: #F4F4F6; font-family: 'Archivo', system-ui, sans-serif; box-sizing: border-box; padding-top: 36px">
  <div style="height: 879px; display: flex; flex-direction: column">

    <header style="height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 20px; flex-shrink: 0">
      <a href="V4-Entry.dc.html" aria-label="Close without saving" style="width: 44px; height: 44px; border-radius: 22px; background: #141417; color: #F4F4F6; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
      <h1 class="w" style="margin: 0; font-size: 19px; font-weight: 600">Edit entry</h1>
    </header>

    <div role="tablist" aria-label="Type" style="position: relative; display: flex; padding: 0 20px; box-shadow: inset 0 -1px 0 #1A1A1F; flex-shrink: 0">
      <button class="{{expTab}}" role="tab" aria-selected="{{isExpense}}" onClick="{{toExpense}}">Expense</button>
      <button class="{{incTab}}" role="tab" aria-selected="{{isIncome}}" onClick="{{toIncome}}">Income</button>
      <span class="ind" aria-hidden="true" style="transform: translateX({{indX}})"></span>
    </div>

    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
      <span style="font-size: 13px; color: #8A8A95">Amount</span>
      <div class="w n {{bumpClass}}" style="display: flex; align-items: center; gap: 4px; font-size: 64px; font-weight: 600; letter-spacing: -0.02em; line-height: 1">
        <span style="font-size: 34px; font-weight: 500; color: #8A8A95; align-self: flex-start; margin-top: 6px">₹</span>
        <output aria-live="polite" style="color: {{amtColor}}">{{amtText}}</output>
        <span class="caret" aria-hidden="true" style="width: 3px; height: 56px; border-radius: 2px; background: #7B6CF6; margin-left: 2px"></span>
      </div>
      <div style="height: 20px">
        <sc-if value="{{amtChanged}}" hint-placeholder-val="{{ false }}"><span class="was n" style="display: block; font-size: 13px; color: #8A8A95">Was ₹486</span></sc-if>
      </div>
    </div>

    <div class="{{catsClass}}" role="radiogroup" aria-label="Category" style="display: flex; gap: 8px; padding: 0 20px; overflow-x: auto; scrollbar-width: none; flex-shrink: 0">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
        <button class="{{c.cls}}" role="radio" aria-checked="{{c.on}}" onClick="{{c.pick}}"><i style="color: {{c.color}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.d}}"></path></svg></i>{{c.name}}</button>
      </sc-for>
    </div>

    <div class="grp" style="margin: 14px 20px 0; flex-shrink: 0">
      <label class="dr" for="desc">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8A95" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>
        <input id="desc" value="{{desc}}" onChange="{{onDesc}}" aria-label="Description" placeholder="What was it for?" style="flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 15px; font-weight: 500">
      </label>
      <a class="dr" href="V4-Date.dc.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8A95" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"></rect><path d="M8 3v4M16 3v4M3.5 10h17"></path></svg>
        <span style="flex: 1; font-size: 15px; font-weight: 500">Wednesday 21 Oct</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8A95" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
      </a>
    </div>

    <div class="w" role="group" aria-label="Amount keypad" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px 12px; padding: 12px 28px 0; flex-shrink: 0">
      <button class="k" onClick="{{k1}}">1</button><button class="k" onClick="{{k2}}">2</button><button class="k" onClick="{{k3}}">3</button>
      <button class="k" onClick="{{k4}}">4</button><button class="k" onClick="{{k5}}">5</button><button class="k" onClick="{{k6}}">6</button>
      <button class="k" onClick="{{k7}}">7</button><button class="k" onClick="{{k8}}">8</button><button class="k" onClick="{{k9}}">9</button>
      <button class="k" aria-label="Double zero" onClick="{{k00}}" style="font-size: 20px">00</button><button class="k" onClick="{{k0}}">0</button>
      <button class="k" aria-label="Delete last digit" onClick="{{back}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7z"></path><path d="m12 9.5 5 5M17 9.5l-5 5"></path></svg></button>
    </div>

    <div style="padding: 10px 20px 24px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px">
      <sc-if value="{{blocked}}" hint-placeholder-val="{{ true }}"><p class="hint" role="status" style="margin: 0; text-align: center; font-size: 13px; color: #A6A6B0">{{hint}}</p></sc-if>
      <button class="{{ctaClass}}" aria-disabled="{{blocked}}" onClick="{{save}}">Save changes</button>
    </div>
  </div>

  <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
    <div class="scrim" style="position: absolute; inset: 0; background: rgba(0,0,0,.62)"></div>
    <section class="up" role="status" style="position: absolute; left: 0; right: 0; bottom: 0; background: #111114; border-radius: 32px 32px 0 0; box-shadow: inset 0 1px 0 rgba(255,255,255,.06); padding: 32px 24px 32px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
      <svg class="ck" width="76" height="76" viewBox="0 0 76 76" aria-hidden="true"><circle cx="38" cy="38" r="34" fill="none" stroke="#5EE0A1" stroke-width="3" pathLength="1" transform="rotate(-90 38 38)"></circle><path d="M25 39l9 9 17-19" fill="none" stroke="#5EE0A1" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" pathLength="1"></path></svg>
      <h2 class="w" style="margin: 8px 0 0; font-size: 22px; font-weight: 600">Changes saved</h2>
      <p style="margin: 0 0 12px; font-size: 15px; line-height: 1.45; color: #A6A6B0">{{doneText}}</p>
      <div style="display: flex; gap: 10px; width: 100%">
        <button onClick="{{keepEditing}}" style="flex: 1; height: 54px; border: 0; border-radius: 27px; background: #1A1A1F; font-size: 15px; font-weight: 500">Keep editing</button>
        <a href="V4-Ledger.dc.html" style="flex: 1; height: 54px; border-radius: 27px; background: linear-gradient(180deg, #6F5EF0, #5240D9); box-shadow: inset 0 1px 0 rgba(255,255,255,.16); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; text-decoration: none">Done</a>
      </div>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var s = this.state || {};
    var type = s.type || 'expense';
    var amt = (typeof s.amt === 'string') ? s.amt : '486';
    var cat = (s.cat === undefined) ? 0 : s.cat;
    var desc = (typeof s.desc === 'string') ? s.desc : 'Swiggy dinner';
    var EXP = [
      { name: 'Food & Dining', color: '#F2A272', d: 'M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 21V3c-2 1.5-3 4-3 7h3' },
      { name: 'Transportation', color: '#5CD3C6', d: 'M5 16V11l2-5h10l2 5v5M3 16h18v3H3zM5 11h14' },
      { name: 'Utilities', color: '#6FB2FF', d: 'M13 2 4 14h7l-1 8 9-12h-7z' },
      { name: 'Shopping', color: '#F08DBA', d: 'M5 8h14l-1 13H6zM9 8V6a3 3 0 0 1 6 0v2' },
      { name: 'Entertainment', color: '#B9A6FF', d: 'M5 5h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zM7 5v14M17 5v14M3 12h18' },
      { name: 'Health', color: '#FF8A80', d: 'M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z' },
      { name: 'Education', color: '#F5CF6E', d: 'm2 9 10-5 10 5-10 5zM6 11v5c3 2 9 2 12 0v-5' },
      { name: 'Other', color: '#A6A6B0', d: 'M5.5 12h1M11.5 12h1M17.5 12h1' }
    ];
    var INC = [
      { name: 'Salary', color: '#5EE0A1', d: 'M3 7h15a3 3 0 0 1 3 3v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 7V6a2 2 0 0 1 2-2h11v3M16 14h2' },
      { name: 'Freelance', color: '#5EE0A1', d: 'M5 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2zM8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18' },
      { name: 'Bonus', color: '#5EE0A1', d: 'M4 11h16v9H4zM3 7h18v4H3zM12 7v13M12 7c-1.5-3-5-3-5-1s3 1 5 1zM12 7c1.5-3 5-3 5-1s-3 1-5 1z' },
      { name: 'Investment', color: '#5EE0A1', d: 'm3 17 6-6 4 4 8-8M15 7h6v6' },
      { name: 'Other', color: '#A6A6B0', d: 'M5.5 12h1M11.5 12h1M17.5 12h1' }
    ];
    var list = type === 'income' ? INC : EXP;
    if (cat !== null && cat >= list.length) { cat = null; }
    var cats = list.map(function (c, i) {
      return { name: c.name, color: c.color, d: c.d, on: i === cat, cls: i === cat ? 'cc on' : 'cc', pick: function () { self.setState({ cat: i }); } };
    });
    var num = amt === '' ? 0 : parseInt(amt, 10);
    var pretty = num.toLocaleString('en-IN');
    var name = desc.trim();
    var changed = type !== 'expense' || num !== 486 || cat !== 0 || name !== 'Swiggy dinner';
    var hint = '';
    if (num === 0) { hint = 'Enter an amount to save this.'; }
    else if (cat === null) { hint = 'Pick a category to save this.'; }
    else if (name === '') { hint = 'Add a description to save this.'; }
    else if (!changed) { hint = 'Change something to save it.'; }
    var blocked = hint !== '';
    var add = function (d) {
      return function () {
        var st = self.state || {};
        var cur = (typeof st.amt === 'string') ? st.amt : amt;
        var next = (cur === '' || cur === '0') ? d.replace(/^0+/, '') : cur + d;
        if (next.length > 7) { return; }
        self.setState({ amt: next, flip: !st.flip });
      };
    };
    var vals = {
      isExpense: type === 'expense',
      isIncome: type === 'income',
      expTab: type === 'expense' ? 'tab on' : 'tab',
      incTab: type === 'income' ? 'tab on' : 'tab',
      indX: type === 'income' ? '96px' : '0px',
      toExpense: function () { if (type !== 'expense') { self.setState({ type: 'expense', cat: null, cflip: !s.cflip }); } },
      toIncome: function () { if (type !== 'income') { self.setState({ type: 'income', cat: null, cflip: !s.cflip }); } },
      cats: cats,
      catsClass: s.cflip === undefined ? '' : (s.cflip ? 'cA' : 'cB'),
      amtText: pretty,
      amtColor: num === 0 ? '#5C5C66' : '#F4F4F6',
      amtChanged: num !== 486 && num !== 0,
      bumpClass: s.flip === undefined ? '' : (s.flip ? 'bA' : 'bB'),
      back: function () { self.setState({ amt: amt.slice(0, -1), flip: !s.flip }); },
      k00: add('00'),
      desc: desc,
      onDesc: function (e) { self.setState({ desc: e.target.value }); },
      blocked: blocked,
      hint: hint,
      ctaClass: blocked ? 'cta off' : 'cta',
      save: function () { if (!blocked) { self.setState({ done: true }); } },
      done: !!s.done,
      doneText: name + ' is now ₹' + pretty + ' under ' + (cat === null ? 'Other' : list[cat].name) + '.',
      keepEditing: function () { self.setState({ done: false }); }
    };
    for (var k = 0; k < 10; k++) { vals['k' + k] = add(String(k)); }
    return vals;
  }
}
</script>
</body>
</html>
