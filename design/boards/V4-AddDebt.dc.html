<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Finey · New debt or credit</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap">
<style>
body{margin:0}
a{color:#A59BFF}a:hover{color:#C8C1FF}
.n{font-variant-numeric:tabular-nums}
.w{font-stretch:125%;font-variation-settings:'wdth' 125}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
input::placeholder{color:#5C5C66}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #A59BFF;outline-offset:2px}
.lbl{display:block;margin:0 0 8px;font-size:13px;font-weight:600;color:#A6A6B0}
.dir{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border:0;border-radius:20px;background:#111114;text-align:left;box-shadow:inset 0 0 0 1px #1A1A1F;transition:background-color .22s ease,box-shadow .22s ease,transform .12s ease}
.dir:active{transform:scale(.98)}
.dir.on{background:rgba(94,224,161,.07);box-shadow:inset 0 0 0 1.5px #5EE0A1}
.dir.on.me{background:rgba(123,108,246,.1);box-shadow:inset 0 0 0 1.5px #7B6CF6}
.di{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.dir.on .di{transform:rotate(-8deg) scale(1.06)}
.amt{position:relative;display:flex;align-items:center;gap:6px;padding-bottom:10px}
.amt::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;background:#1F1F25;transition:background-color .2s ease}
.amt:focus-within::after{background:#7B6CF6}
.fld{height:56px;border-radius:18px;background:#111114;display:flex;align-items:center;gap:12px;padding:0 16px;box-shadow:inset 0 0 0 1px #1A1A1F;transition:box-shadow .18s ease,background-color .18s ease;color:#F4F4F6;text-decoration:none}
.fld:hover{color:#F4F4F6}
.fld:focus-within{background:#131317;box-shadow:0 0 0 1.5px rgba(123,108,246,.65)}
.fld input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:15px;font-weight:500}
.fld input::placeholder{color:#8A8A95}
.pc{height:40px;padding:0 14px 0 4px;border:0;border-radius:20px;background:#141417;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:#D9D9DE;flex-shrink:0;transition:background-color .18s ease,box-shadow .18s ease,color .18s ease,transform .12s ease}
.pc:active,.cg:active{transform:scale(.96)}
.pc i{width:32px;height:32px;border-radius:16px;background:#1F1F25;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;font-weight:600}
.cg{height:40px;padding:0 16px;border:0;border-radius:20px;background:#141417;font-size:14px;font-weight:500;color:#D9D9DE;flex-shrink:0;transition:background-color .18s ease,box-shadow .18s ease,color .18s ease,transform .12s ease}
.pc.on,.cg.on{background:rgba(123,108,246,.2);box-shadow:inset 0 0 0 1.5px #7B6CF6;color:#F4F4F6}
.cta{height:56px;border:0;border-radius:28px;width:100%;background:linear-gradient(180deg,#6F5EF0,#5240D9);box-shadow:inset 0 1px 0 rgba(255,255,255,.16);color:#FFFFFF;font-size:16px;font-weight:600;padding:0 20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .2s ease,transform .12s ease}
.cta:active{transform:scale(.98)}
.cta.off{opacity:.38;cursor:not-allowed}
.hint{animation:fade .24s ease both}
@keyframes fade{from{opacity:0}}
.scrim{animation:fade .3s ease both}
.up{animation:up .4s cubic-bezier(.3,.7,.2,1) both}
@keyframes up{from{transform:translateY(100%)}}
.ck circle,.ck path{stroke-dasharray:1;animation:draw .5s cubic-bezier(.4,0,.2,1) both}
.ck circle{animation-delay:.2s}
.ck path{animation-delay:.55s;animation-duration:.32s}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:1ms!important}}
</style>
</helmet>
<div style="width: 412px; height: 915px; position: relative; overflow: hidden; background: #08080A; color: #F4F4F6; font-family: 'Archivo', system-ui, sans-serif; box-sizing: border-box; padding-top: 36px">
  <div style="height: 879px; display: flex; flex-direction: column">

    <header style="height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 20px; flex-shrink: 0">
      <a href="V4-People.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; background: #141417; color: #F4F4F6; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
      <h1 class="w" style="margin: 0; font-size: 19px; font-weight: 600">New record</h1>
    </header>

    <div style="flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding: 8px 20px 12px; display: flex; flex-direction: column; gap: 20px">

      <div role="radiogroup" aria-label="Who owes whom" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <button class="{{themCls}}" role="radio" aria-checked="{{isThem}}" onClick="{{toThem}}">
          <span class="di" style="background: rgba(94,224,161,.14); color: #5EE0A1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 7 7 17M7 9v8h8"></path></svg></span>
          <span style="font-size: 15px; font-weight: 600">They owe me</span>
          <span style="font-size: 12px; line-height: 1.4; color: #8A8A95">You lent money or paid for them</span>
        </button>
        <button class="{{meCls}}" role="radio" aria-checked="{{isMe}}" onClick="{{toMe}}">
          <span class="di" style="background: rgba(123,108,246,.18); color: #A59BFF"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"></path></svg></span>
          <span style="font-size: 15px; font-weight: 600">I owe them</span>
          <span style="font-size: 12px; line-height: 1.4; color: #8A8A95">You borrowed, or they paid for you</span>
        </button>
      </div>

      <div>
        <label class="lbl" for="amount">Amount</label>
        <div class="amt">
          <span class="w" style="font-size: 30px; font-weight: 500; color: #8A8A95">₹</span>
          <input id="amount" class="w n" inputmode="numeric" autocomplete="off" value="{{amtText}}" onChange="{{onAmt}}" placeholder="0" style="flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 44px; font-weight: 600; letter-spacing: -0.02em; color: {{amtColor}}; transition: color .2s ease">
        </div>
      </div>

      <div>
        <label class="lbl" for="person">Person</label>
        <label class="fld">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8A95" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4-6 8-6s7 2 8 6"></path></svg>
          <input id="person" value="{{name}}" onChange="{{onName}}" placeholder="Who is it?" autocomplete="off">
        </label>
        <div role="group" aria-label="Recent people" style="display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; scrollbar-width: none">
          <sc-for list="{{people}}" as="p" hint-placeholder-count="4">
            <button class="{{p.cls}}" aria-pressed="{{p.on}}" onClick="{{p.pick}}"><i>{{p.initial}}</i>{{p.name}}</button>
          </sc-for>
        </div>
      </div>

      <div>
        <span class="lbl" id="cat-lbl">What kind</span>
        <div role="radiogroup" aria-labelledby="cat-lbl" style="display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none">
          <sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
            <button class="{{c.cls}}" role="radio" aria-checked="{{c.on}}" onClick="{{c.pick}}">{{c.name}}</button>
          </sc-for>
        </div>
      </div>

      <div style="border-radius: 18px; background: #111114; box-shadow: inset 0 0 0 1px #1A1A1F; overflow: hidden">
        <label style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 16px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8A95" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>
          <input value="{{note}}" onChange="{{onNote}}" aria-label="Note" placeholder="What was it for? Optional" style="flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 15px; font-weight: 500">
        </label>
        <a href="V4-Date.dc.html" style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 16px; color: #F4F4F6; text-decoration: none; box-shadow: inset 0 1px 0 #1A1A1F">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8A95" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"></rect><path d="M8 3v4M16 3v4M3.5 10h17"></path></svg>
          <span style="flex: 1; font-size: 15px; font-weight: 500">Today, Wednesday 21 Oct</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8A95" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
        </a>
      </div>
    </div>

    <div style="padding: 8px 20px 24px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px">
      <sc-if value="{{blocked}}" hint-placeholder-val="{{ true }}"><p class="hint" role="status" style="margin: 0; text-align: center; font-size: 13px; color: #A6A6B0">{{hint}}</p></sc-if>
      <button class="{{ctaClass}}" aria-disabled="{{blocked}}" onClick="{{save}}">{{ctaLabel}}</button>
    </div>
  </div>

  <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
    <div class="scrim" style="position: absolute; inset: 0; background: rgba(0,0,0,.62)"></div>
    <section class="up" role="status" style="position: absolute; left: 0; right: 0; bottom: 0; background: #111114; border-radius: 32px 32px 0 0; box-shadow: inset 0 1px 0 rgba(255,255,255,.06); padding: 32px 24px 32px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
      <svg class="ck" width="76" height="76" viewBox="0 0 76 76" aria-hidden="true"><circle cx="38" cy="38" r="34" fill="none" stroke="#5EE0A1" stroke-width="3" pathLength="1" transform="rotate(-90 38 38)"></circle><path d="M25 39l9 9 17-19" fill="none" stroke="#5EE0A1" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" pathLength="1"></path></svg>
      <h2 class="w" style="margin: 8px 0 0; font-size: 22px; font-weight: 600">Record added</h2>
      <p class="n" style="margin: 0 0 12px; font-size: 15px; line-height: 1.45; color: #A6A6B0">{{doneText}}</p>
      <div style="display: flex; gap: 10px; width: 100%">
        <button onClick="{{again}}" style="flex: 1; height: 54px; border: 0; border-radius: 27px; background: #1A1A1F; font-size: 15px; font-weight: 500">Add another</button>
        <a href="V4-People.dc.html" style="flex: 1; height: 54px; border-radius: 27px; background: linear-gradient(180deg, #6F5EF0, #5240D9); box-shadow: inset 0 1px 0 rgba(255,255,255,.16); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; text-decoration: none">Done</a>
      </div>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var s = this.state || {};
    var dir = s.dir || 'them';
    var amt = (typeof s.amt === 'string') ? s.amt : '';
    var name = (typeof s.name === 'string') ? s.name : '';
    var cat = s.cat || 'Loan';
    var note = (typeof s.note === 'string') ? s.note : '';
    var num = amt ? parseInt(amt, 10) : 0;
    var nm = name.trim();
    var pretty = num.toLocaleString('en-IN');
    var hint = '';
    if (!nm && !num) { hint = 'Add a name and amount to continue.'; }
    else if (!num) { hint = 'Add an amount to continue.'; }
    else if (!nm) { hint = 'Add a name to continue.'; }
    var blocked = hint !== '';
    var PEOPLE = [{ n: 'Rahul', i: 'R' }, { n: 'Arjun', i: 'A' }, { n: 'Meera', i: 'M' }, { n: 'Priya', i: 'P' }];
    var CATS = ['Loan', 'Shared expense', 'Payment', 'Other'];
    return {
      isThem: dir === 'them',
      isMe: dir === 'me',
      themCls: dir === 'them' ? 'dir on' : 'dir',
      meCls: dir === 'me' ? 'dir on me' : 'dir',
      toThem: function () { self.setState({ dir: 'them' }); },
      toMe: function () { self.setState({ dir: 'me' }); },
      amtText: num ? pretty : '',
      amtColor: dir === 'them' ? '#5EE0A1' : '#C8C1FF',
      onAmt: function (e) {
        var v = String(e.target.value).replace(/[^0-9]/g, '').replace(/^0+/, '').slice(0, 8);
        self.setState({ amt: v });
      },
      name: name,
      onName: function (e) { self.setState({ name: e.target.value }); },
      people: PEOPLE.map(function (p) {
        var on = nm.toLowerCase() === p.n.toLowerCase();
        return { name: p.n, initial: p.i, on: on, cls: on ? 'pc on' : 'pc', pick: function () { self.setState({ name: p.n }); } };
      }),
      cats: CATS.map(function (c) {
        return { name: c, on: c === cat, cls: c === cat ? 'cg on' : 'cg', pick: function () { self.setState({ cat: c }); } };
      }),
      note: note,
      onNote: function (e) { self.setState({ note: e.target.value }); },
      blocked: blocked,
      hint: hint,
      ctaClass: blocked ? 'cta off' : 'cta',
      ctaLabel: blocked ? 'Add record' : (dir === 'them' ? 'Add ₹' + pretty + ' ' + nm + ' owes you' : 'Add ₹' + pretty + ' you owe ' + nm),
      save: function () { if (!blocked) { self.setState({ done: true }); } },
      done: !!s.done,
      doneText: (dir === 'them' ? nm + ' owes you ₹' + pretty : 'You owe ' + nm + ' ₹' + pretty) + '. You will find it under People.',
      again: function () { self.setState({ done: false, amt: '', name: '', note: '', cat: 'Loan' }); }
    };
  }
}
</script>
</body>
</html>
