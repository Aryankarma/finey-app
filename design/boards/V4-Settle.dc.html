<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Finey · Record payment</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap">
<style>
body{margin:0}
a{color:#A59BFF}a:hover{color:#C8C1FF}
.n{font-variant-numeric:tabular-nums}
.w{font-stretch:125%;font-variation-settings:'wdth' 125}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
input::placeholder{color:#8A8A95}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #A59BFF;outline-offset:2px}
.q{height:56px;border:0;border-radius:18px;background:#1A1A1F;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:15px;font-weight:600;color:#F4F4F6;transition:background-color .18s ease,box-shadow .18s ease,transform .12s ease}
.q:active{transform:scale(.96)}
.q span{font-size:12px;font-weight:500;color:#A6A6B0;font-variant-numeric:tabular-nums}
.q.on{background:rgba(123,108,246,.2);box-shadow:inset 0 0 0 1.5px #7B6CF6}
.q.on span{color:#DCD7FF}
.k{height:52px;border:0;border-radius:26px;background:transparent;color:#F4F4F6;font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;transition:background-color .14s ease,transform .12s cubic-bezier(.2,.8,.2,1)}
.k:active{background:#1A1A1F;transform:scale(.94)}
.seg{border-radius:4px;transition:flex-grow .32s cubic-bezier(.2,.8,.2,1)}
.cta{height:56px;border:0;border-radius:28px;width:100%;background:linear-gradient(180deg,#6F5EF0,#5240D9);box-shadow:inset 0 1px 0 rgba(255,255,255,.16);color:#FFFFFF;font-size:16px;font-weight:600;transition:opacity .2s ease,transform .12s ease}
.cta:active{transform:scale(.98)}
.cta.off{opacity:.38;cursor:not-allowed}
.bA{animation:bumpA .18s cubic-bezier(.2,.8,.2,1)}
.bB{animation:bumpB .18s cubic-bezier(.2,.8,.2,1)}
@keyframes bumpA{from{transform:scale(1.045)}}
@keyframes bumpB{from{transform:scale(1.045)}}
.fade{animation:fade .3s ease both}
@keyframes fade{from{opacity:0}}
@keyframes blink{50%{opacity:0}}
.caret{animation:blink 1.1s steps(1) infinite}
.fill{animation:ring .9s cubic-bezier(.3,.7,.2,1) both .15s}
@keyframes ring{from{stroke-dashoffset:207.4}}
.ck{stroke-dasharray:1;animation:draw .34s cubic-bezier(.4,0,.2,1) both 1s}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.rise{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:1ms!important}}
</style>
</helmet>
<div style="width: 412px; height: 915px; position: relative; overflow: hidden; background: #08080A; color: #F4F4F6; font-family: 'Archivo', system-ui, sans-serif; box-sizing: border-box; padding-top: 36px">

  <header aria-hidden="true" style="height: 56px; display: flex; align-items: center; padding: 0 20px">
    <span class="w" style="font-size: 26px; font-weight: 600; letter-spacing: -0.01em">People</span>
  </header>
  <div aria-hidden="true" style="padding: 18px 20px 0; display: flex; justify-content: space-between">
    <div style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 13px; color: #8A8A95">You owe</span><span class="w n" style="font-size: 22px; font-weight: 600">₹4,000</span></div>
    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 3px"><span style="font-size: 13px; color: #8A8A95">Owed to you</span><span class="w n" style="font-size: 22px; font-weight: 600; color: #5EE0A1">₹8,750</span></div>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(0,0,0,.6)"></div>

  <section role="dialog" aria-labelledby="st-title" style="position: absolute; left: 0; right: 0; bottom: 0; background: #111114; border-radius: 32px 32px 0 0; box-shadow: inset 0 1px 0 rgba(255,255,255,.06); padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 16px; min-height: 560px; box-sizing: border-box">
    <div style="width: 40px; height: 4px; border-radius: 2px; background: #2A2A31; align-self: center"></div>

    <sc-if value="{{editing}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; align-items: center; gap: 14px">
          <span style="position: relative; width: 52px; height: 52px; flex-shrink: 0"><svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true" style="position: absolute; inset: 0"><circle cx="26" cy="26" r="24" fill="none" stroke="#1A1A1F" stroke-width="3"></circle><circle cx="26" cy="26" r="24" fill="none" stroke="#5EE0A1" stroke-width="3" stroke-linecap="round" stroke-dasharray="37.7 150.8" transform="rotate(-90 26 26)"></circle></svg><span style="position: absolute; left: 6px; top: 6px; width: 40px; height: 40px; border-radius: 20px; background: #1A1A1F; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600">R</span></span>
          <div style="display: flex; flex-direction: column; gap: 3px">
            <h2 id="st-title" class="w" style="margin: 0; font-size: 17px; font-weight: 600">Rahul is paying you back</h2>
            <span style="font-size: 14px; color: #A6A6B0"><span class="n" style="color: #F4F4F6">₹750</span> of <span class="n">₹1,000</span> is still to come</span>
          </div>
        </div>

        <div class="w n {{bumpClass}}" style="display: flex; align-items: center; justify-content: center; gap: 4px; padding: 6px 0 2px; font-size: 52px; font-weight: 600; letter-spacing: -0.02em; line-height: 1">
          <span style="font-size: 28px; font-weight: 500; color: #8A8A95; align-self: flex-start; margin-top: 4px">₹</span><output aria-label="Amount received" style="color: {{amtColor}}">{{amtText}}</output><span class="caret" aria-hidden="true" style="width: 3px; height: 46px; border-radius: 2px; background: #7B6CF6; margin-left: 2px"></span>
        </div>

        <div>
          <div role="img" aria-label="{{barLabel}}" style="display: flex; gap: 3px; height: 8px">
            <div class="seg" style="flex-grow: 250; flex-basis: 0; background: #A59BFF"></div>
            <div class="seg" style="flex-grow: {{payGrow}}; flex-basis: 0; background: #5EE0A1"></div>
            <div class="seg" style="flex-grow: {{restGrow}}; flex-basis: 0; background: #1A1A1F"></div>
          </div>
          <div style="display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px"><span style="color: #A6A6B0">₹250 paid earlier</span><span role="status" style="color: {{capColor}}; font-weight: 600">{{caption}}</span></div>
        </div>

        <div role="radiogroup" aria-label="Bring the total paid back to" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
          <button class="{{q0}}" role="radio" aria-checked="{{c0}}" onClick="{{p0}}">50%<span>₹250</span></button>
          <button class="{{q1}}" role="radio" aria-checked="{{c1}}" onClick="{{p1}}">75%<span>₹500</span></button>
          <button class="{{q2}}" role="radio" aria-checked="{{c2}}" onClick="{{p2}}">All of it<span>₹750</span></button>
        </div>

        <label style="height: 48px; border-radius: 24px; background: #1A1A1F; display: flex; align-items: center; gap: 10px; padding: 0 16px; color: #8A8A95">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>
          <input aria-label="Note" placeholder="Add a note, like paid by UPI" style="flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 15px">
        </label>

        <div class="w" role="group" aria-label="Amount keypad" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px 12px; padding: 0 12px">
          <button class="k" onClick="{{k1}}">1</button><button class="k" onClick="{{k2}}">2</button><button class="k" onClick="{{k3}}">3</button>
          <button class="k" onClick="{{k4}}">4</button><button class="k" onClick="{{k5}}">5</button><button class="k" onClick="{{k6}}">6</button>
          <button class="k" onClick="{{k7}}">7</button><button class="k" onClick="{{k8}}">8</button><button class="k" onClick="{{k9}}">9</button>
          <button class="k" aria-label="Double zero" onClick="{{k00}}" style="font-size: 18px">00</button><button class="k" onClick="{{k0}}">0</button>
          <button class="k" aria-label="Delete last digit" onClick="{{back}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7z"></path><path d="m12 9.5 5 5M17 9.5l-5 5"></path></svg></button>
        </div>

        <button class="{{ctaClass}}" aria-disabled="{{blocked}}" onClick="{{record}}">{{ctaLabel}}</button>
      </div>
    </sc-if>

    <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
      <div role="status" style="display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 28px 8px 8px; text-align: center">
        <div style="position: relative; width: 112px; height: 112px">
          <svg width="112" height="112" viewBox="0 0 112 112" aria-hidden="true">
            <circle cx="56" cy="56" r="44" fill="none" stroke="#1A1A1F" stroke-width="8"></circle>
            <circle class="fill" cx="56" cy="56" r="44" fill="none" stroke="#5EE0A1" stroke-width="8" stroke-linecap="round" stroke-dasharray="276.5" transform="rotate(-90 56 56)" style="stroke-dashoffset: {{ringOff}}"></circle>
          </svg>
          <sc-if value="{{full}}" hint-placeholder-val="{{ true }}"><svg width="112" height="112" viewBox="0 0 112 112" aria-hidden="true" style="position: absolute; inset: 0"><path class="ck" pathLength="1" d="M40 57l11 11 22-24" fill="none" stroke="#5EE0A1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if>
          <sc-if value="{{partial}}" hint-placeholder-val="{{ false }}"><span class="w n fade" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600; animation-delay: .9s">{{pctText}}</span></sc-if>
        </div>
        <h2 class="w rise" style="margin: 6px 0 0; font-size: 21px; font-weight: 600; animation-delay: .4s">{{doneTitle}}</h2>
        <p class="rise" style="margin: 0 0 10px; font-size: 15px; line-height: 1.5; color: #A6A6B0; animation-delay: .5s">{{doneText}}</p>
        <a class="rise" href="V4-People.dc.html" style="width: 100%; height: 56px; border-radius: 28px; background: linear-gradient(180deg, #6F5EF0, #5240D9); box-shadow: inset 0 1px 0 rgba(255,255,255,.16); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; text-decoration: none; animation-delay: .6s">Done</a>
      </div>
    </sc-if>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  renderVals() {
    var self = this;
    var s = this.state || {};
    var amt = (typeof s.amt === 'string') ? s.amt : '750';
    var num = amt === '' ? 0 : parseInt(amt, 10);
    var fmt = function (v) { return v.toLocaleString('en-IN'); };
    var over = num > 750;
    var blocked = num === 0 || over;
    var pay = Math.min(num, 750);
    var after = 250 + pay;
    var set = function (v) { return function () { self.setState({ amt: String(v), flip: !s.flip }); }; };
    var add = function (d) {
      return function () {
        var cur = (self.state && typeof self.state.amt === 'string') ? self.state.amt : amt;
        var next = (cur === '' || cur === '0') ? d.replace(/^0+/, '') : cur + d;
        if (next.length > 6) { return; }
        self.setState({ amt: next, flip: !(self.state && self.state.flip) });
      };
    };
    var caption, capColor;
    if (over) { caption = "That's more than the ₹750 still owed"; capColor = '#FF9AA2'; }
    else if (num === 0) { caption = 'Enter what Rahul paid'; capColor = '#A6A6B0'; }
    else if (num === 750) { caption = 'Fully paid back after this'; capColor = '#5EE0A1'; }
    else { caption = '₹' + fmt(750 - num) + ' will still be owed'; capColor = '#A6A6B0'; }
    var vals = {
      editing: !s.done,
      done: !!s.done,
      amtText: fmt(num),
      amtColor: num === 0 ? '#5C5C66' : (over ? '#FF9AA2' : '#F4F4F6'),
      bumpClass: s.flip === undefined ? '' : (s.flip ? 'bA' : 'bB'),
      payGrow: String(pay),
      restGrow: String(750 - pay),
      barLabel: '₹250 paid earlier, ₹' + fmt(pay) + ' now, ₹' + fmt(750 - pay) + ' left after this',
      caption: caption,
      capColor: capColor,
      blocked: blocked,
      ctaClass: blocked ? 'cta off' : 'cta',
      ctaLabel: blocked ? 'Record payment' : 'Record ₹' + fmt(num) + ' from Rahul',
      record: function () { if (!blocked) { self.setState({ done: true }); } },
      back: function () { self.setState({ amt: amt.slice(0, -1), flip: !s.flip }); },
      k00: add('00'),
      full: after >= 1000,
      partial: after < 1000,
      ringOff: (276.5 * (1 - after / 1000)).toFixed(1),
      pctText: Math.round(after / 10) + '%',
      doneTitle: after >= 1000 ? 'Rahul has paid you back' : 'Payment recorded',
      doneText: after >= 1000 ? 'The loan is settled and moves to Settled.' : '₹' + fmt(1000 - after) + ' is still to come from Rahul.'
    };
    var QS = [250, 500, 750];
    for (var i = 0; i < 3; i++) {
      vals['q' + i] = num === QS[i] ? 'q on' : 'q';
      vals['c' + i] = num === QS[i];
      vals['p' + i] = set(QS[i]);
    }
    for (var k = 0; k < 10; k++) { vals['k' + k] = add(String(k)); }
    return vals;
  }
}
</script>
</body>
</html>
