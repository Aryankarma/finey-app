<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap">
<style>
body{margin:0}
a{color:#A59BFF}a:hover{color:#C8C1FF}
.n{font-variant-numeric:tabular-nums}
.w{font-stretch:125%;font-variation-settings:'wdth' 125}
button{font:inherit;color:inherit;cursor:pointer}

.ib{width:44px;height:44px;border:0;border-radius:22px;background:#141417;color:#F4F4F6;display:flex;align-items:center;justify-content:center;transition:transform .12s ease}
.ib:active{transform:scale(.94)}
.tab{position:relative;height:44px;display:flex;align-items:center;color:#8A8A95;font-size:15px;font-weight:500;text-decoration:none}
.tab.on{color:#F4F4F6}

.chip{height:36px;padding:0 14px;border:0;border-radius:18px;background:#141417;color:#D9D9DE;font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap;flex-shrink:0;text-decoration:none;transition:background-color .2s ease,color .2s ease,transform .12s ease}
.chip:active{transform:scale(.96)}
.chip.on{background:rgba(123,108,246,.2);color:#DCD7FF}
.gh{display:flex;align-items:baseline;justify-content:space-between;height:32px;font-size:13px;color:#8A8A95}
.r{display:flex;align-items:center;gap:14px;height:60px;color:#F4F4F6;text-decoration:none;border-radius:14px;transition:background-color .15s ease}
.r:hover{color:#F4F4F6}

.gl{width:40px;height:40px;border-radius:20px;background:#141417;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lA{animation:lA .3s cubic-bezier(.2,.8,.2,1) both}
.lB{animation:lB .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes lA{from{opacity:0;transform:translateY(8px)}}
@keyframes lB{from{opacity:0;transform:translateY(8px)}}
.scrim{animation:fade .3s ease both}
.scrim.out{animation:fadeOut .26s ease both}
@keyframes fade{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
.sheet{animation:up .42s cubic-bezier(.3,.7,.2,1) both}
.sheet.out{animation:down .26s cubic-bezier(.4,0,1,1) both}
@keyframes up{from{transform:translateY(100%)}}
@keyframes down{to{transform:translateY(100%)}}
.lbl{display:block;margin:0 0 10px;font-size:13px;font-weight:600;color:#A6A6B0}
.seg{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));height:48px;padding:4px;border-radius:24px;background:#1A1A1F;box-sizing:border-box}
.seg button{position:relative;z-index:1;border:0;background:transparent;font-size:14px;font-weight:500;color:#A6A6B0;transition:color .2s ease}
.seg button.on{color:#F4F4F6;font-weight:600}
.thumb{position:absolute;top:4px;left:4px;bottom:4px;width:calc((100% - 8px) / 3);border-radius:20px;background:#2C2C34;box-shadow:inset 0 1px 0 rgba(255,255,255,.06);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.swr{width:100%;display:flex;align-items:center;gap:14px;padding:14px 0;border:0;background:transparent;text-align:left}
.sw{position:relative;width:52px;height:32px;border-radius:16px;background:#26262D;flex-shrink:0;transition:background-color .22s ease}

.rd{width:100%;height:52px;border:0;background:transparent;display:flex;align-items:center;justify-content:space-between;padding:0;font-size:15px;font-weight:500;color:#F4F4F6;text-align:left}
.rd+.rd{box-shadow:inset 0 1px 0 #1C1C21}
.rg{position:relative;width:22px;height:22px;border-radius:11px;box-shadow:inset 0 0 0 2px #4A4A54;transition:box-shadow .2s ease;flex-shrink:0}
.rg::after{content:"";position:absolute;left:6px;top:6px;width:10px;height:10px;border-radius:5px;background:#A59BFF;transform:scale(0);transition:transform .24s cubic-bezier(.2,.8,.2,1)}

    <a class="ti on" href="V4-Ledger.dc.html" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"></path></svg>Ledger</a>
    <a class="ti" href="V4-People.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M3 20c.8-3.4 3.2-5 6-5s5.2 1.6 6 5M16 4.5a3.5 3.5 0 0 1 0 7M18 15c1.6.6 2.6 2.2 3 5"></path></svg>People</a>
    <a class="ti" href="V4-Wealth.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 17 6-6 4 4 8-8M15 7h6v6"></path></svg>Wealth</a>
  </nav>

        <h2 id="filter-title" class="w" style="margin: 0; font-size: 20px; font-weight: 600">Filter and sort</h2>
        <button class="reset" disabled="{{isDefault}}" onClick="{{reset}}">Reset</button>
      </div>

      <span class="lbl" id="show-lbl">Show</span>
      <div class="seg" role="radiogroup" aria-labelledby="show-lbl">
        <span class="thumb" aria-hidden="true" style="transform: translateX({{thumbX}})"></span>
        <button class="{{segAll}}" role="radio" aria-checked="{{onAll}}" onClick="{{setAll}}">All</button>
        <button class="{{segExp}}" role="radio" aria-checked="{{onExp}}" onClick="{{setExp}}">Expenses</button>
        <button class="{{segInc}}" role="radio" aria-checked="{{onInc}}" onClick="{{setInc}}">Income</button>
      </div>

      <button class="swr" role="switch" aria-checked="{{dSaved}}" onClick="{{toggleSaved}}" style="margin-top: 8px">
        <span style="width: 40px; height: 40px; border-radius: 20px; background: #1A1A1F; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="{{dSavedFill}}" stroke="{{dSavedStroke}}" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg></span>

        <span class="{{swClass}}" aria-hidden="true"><i></i></span>
      </button>

      <span class="lbl" id="sort-lbl" style="margin-top: 10px">Sort by</span>
      <div role="radiogroup" aria-labelledby="sort-lbl">
        <sc-for list="{{sorts}}" as="o" hint-placeholder-count="4">
          <button class="rd" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}">{{o.label}}<i class="{{o.ring}}" aria-hidden="true"></i></button>
        </sc-for>
      </div>

      <button class="{{ctaClass}}" aria-disabled="{{noMatch}}" onClick="{{apply}}" style="margin-top: 18px"><span class="{{ctaFlip}}">{{ctaLabel}}</span></button>
    </section>
  </sc-if>
</div>

        var tot = 0;
        full.forEach(function (x) { if (x.d === e.d) { tot += x.inc ? x.a : -x.a; } });
        items.push({ head: true, row: false, mt: items.length ? '16px' : '0px', t1: e.d === 21 ? 'Today' : wd(e.d) + ' ' + e.d + ' Oct', t2: e.d === 21 ? 'Wed 21 Oct' : '', total: (tot >= 0 ? '+₹' : '−₹') + fmt(Math.abs(tot)), name: '', saved: false, sub: '', amt: '', amtColor: '#F4F4F6', color: '#8A8A95', d: '' });
        lastDay = e.d;
      }
      items.push({
        head: false, row: true, mt: '0px', t1: '', t2: '', total: '', name: e.n, saved: !!e.sv,
        sub: byDate ? e.c : e.c + ', ' + e.d + ' Oct',
        amt: (e.inc ? '+₹' : '−₹') + fmt(e.a), amtColor: e.inc ? '#5EE0A1' : '#F4F4F6',
        color: IC[e.k].color, d: IC[e.k].d
      });
    });
    var count = countFor(applied);
    var countText;
    var totalText;
    var totalColor = '#F4F4F6';
    if (applied.saved) {
      countText = applied.show === 'income' ? 'No saved income' : (applied.show === 'all' ? '3 saved entries' : '3 saved expenses');
      totalText = applied.show === 'income' ? '₹0' : '−₹8,540';
    } else if (applied.show === 'all') {
      countText = '60 entries'; totalText = '+₹56,260'; totalColor = '#5EE0A1';
    } else if (applied.show === 'expense') {
      countText = '58 expenses'; totalText = '−₹68,240';
    } else {
      countText = '2 income entries'; totalText = '+₹1,24,500'; totalColor = '#5EE0A1';
    }
    var setDraft = function (patch) {
      return function () {
        var st = self.state || {};
        var cur = st.draft || draft;
        var next = { show: cur.show, saved: cur.saved, sort: cur.sort };
        Object.keys(patch).forEach(function (k) { next[k] = patch[k]; });
        var changed = countFor(next) !== countFor(cur);
        var upd = { draft: next };
        if (changed) { upd.cflip = !st.cflip; }
        self.setState(upd);
      };
    };
    var hide = function (apply) {
      if (self.t1) { clearTimeout(self.t1); }
      self.setState({ closing: true });
      self.t1 = setTimeout(function () {
        var st = self.state || {};
        var next = { open: false, closing: false };
        if (apply) { next.applied = st.draft || draft; next.lflip = !st.lflip; }
        self.setState(next);
      }, 260);
    };
    var dCount = countFor(draft);
    var isDefault = draft.show === DEF.show && !draft.saved && draft.sort === DEF.sort;
    var X = { all: '0%', expense: '100%', income: '200%' };
    return {
      open: open,
      scrimClass: closing ? 'scrim out' : 'scrim',
      sheetClass: closing ? 'sheet out' : 'sheet',
      close: function () { if (!closing) { hide(false); } },
      apply: function () { if (!closing && dCount > 0) { hide(true); } },
      reopen: function () {
        if (self.t1) { clearTimeout(self.t1); }
        self.setState({ open: true, closing: false, draft: applied });
      },
      clearAll: function () { var st = self.state || {}; self.setState({ applied: DEF, draft: DEF, lflip: !st.lflip }); },
      showChip: applied.show === 'expense' ? 'Expenses only' : (applied.show === 'income' ? 'Income only' : 'All entries'),
      showChipCls: applied.show === 'all' ? 'chip' : 'chip on',
      savedChipCls: applied.saved ? 'chip on' : 'chip',
      savedFill: applied.saved ? 'currentColor' : 'none',
      sortChip: sortLabel(applied.sort),
      countText: countText,
      totalText: totalText,
      totalColor: totalColor,
      items: items,
      empty: items.length === 0,
      listClass: s.lflip === undefined ? '' : (s.lflip ? 'lA' : 'lB'),
      thumbX: X[draft.show],
      segAll: draft.show === 'all' ? 'on' : '',
      segExp: draft.show === 'expense' ? 'on' : '',
      segInc: draft.show === 'income' ? 'on' : '',
      onAll: draft.show === 'all',
      onExp: draft.show === 'expense',
      onInc: draft.show === 'income',
      setAll: setDraft({ show: 'all' }),
      setExp: setDraft({ show: 'expense' }),
      setInc: setDraft({ show: 'income' }),
      dSaved: draft.saved,
      dSavedFill: draft.saved ? '#A59BFF' : 'none',
      dSavedStroke: draft.saved ? '#A59BFF' : '#A6A6B0',
      swClass: draft.saved ? 'sw on' : 'sw',
      toggleSaved: setDraft({ saved: !draft.saved }),
      sorts: SORTS.map(function (o) {
        var on = draft.sort === o.key;
        return { label: o.label, on: on, ring: on ? 'rg on' : 'rg', pick: setDraft({ sort: o.key }) };
      }),
      isDefault: isDefault,
      reset: function () { var st = self.state || {}; self.setState({ draft: DEF, cflip: !st.cflip }); },
      noMatch: dCount === 0,
      ctaClass: dCount === 0 ? 'cta off' : 'cta',
      ctaLabel: dCount === 0 ? 'No entries match' : (dCount === 1 ? 'Show 1 entry' : 'Show ' + dCount + ' entries'),
      ctaFlip: s.cflip === undefined ? '' : (s.cflip ? 'cA' : 'cB')
    };
  }
}
</script>
