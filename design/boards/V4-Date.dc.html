<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Finey · Pick a date</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap">
<style>
body{margin:0}
a{color:#A59BFF}a:hover{color:#C8C1FF}
.n{font-variant-numeric:tabular-nums}
.w{font-stretch:125%;font-variation-settings:'wdth' 125}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid #A59BFF;outline-offset:2px}
.ib{width:44px;height:44px;border:0;border-radius:22px;background:#1A1A1F;color:#F4F4F6;display:flex;align-items:center;justify-content:center;transition:transform .12s ease,opacity .2s ease}
.ib:active{transform:scale(.94)}
.ib:disabled{opacity:.3;cursor:default;transform:none}
.tab{width:96px;height:44px;border:0;background:transparent;padding:0;font-size:15px;font-weight:500;color:#8A8A95}
.tab.on{color:#F4F4F6}
.cc{height:44px;padding:0 16px 0 6px;border-radius:22px;background:#141417;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;white-space:nowrap;flex-shrink:0;color:#D9D9DE}
.cc.on{background:rgba(123,108,246,.2);box-shadow:inset 0 0 0 1.5px #7B6CF6;color:#F4F4F6}
.cc i{width:32px;height:32px;border-radius:16px;background:#1C1C21;display:flex;align-items:center;justify-content:center}
.dr{width:100%;display:flex;align-items:center;gap:14px;height:56px;padding:0 16px;border:0;background:transparent;text-align:left;color:#F4F4F6;text-decoration:none;box-sizing:border-box}
.dr+.dr{box-shadow:inset 0 1px 0 #1A1A1F}
.k{height:58px;border-radius:29px;color:#F4F4F6;font-size:24px;font-weight:500;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center}
.fA{animation:flA 1.1s ease both}
.fB{animation:flB 1.1s ease both}
@keyframes flA{0%{background-color:rgba(123,108,246,.28)}100%{background-color:rgba(123,108,246,0)}}
@keyframes flB{0%{background-color:rgba(123,108,246,.28)}100%{background-color:rgba(123,108,246,0)}}
.scrim{animation:fade .3s ease both}
.scrim.out{animation:fadeOut .26s ease both}
@keyframes fade{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
.sheet{animation:up .42s cubic-bezier(.3,.7,.2,1) both}
.sheet.out{animation:down .26s cubic-bezier(.4,0,1,1) both}
@keyframes up{from{transform:translateY(100%)}}
@keyframes down{to{transform:translateY(100%)}}
.qc{height:36px;padding:0 16px;border:0;border-radius:18px;background:#1A1A1F;color:#D9D9DE;font-size:13px;font-weight:500;transition:background-color .18s ease,box-shadow .18s ease,color .18s ease,transform .12s ease}
.qc:active{transform:scale(.96)}
.qc.on{background:rgba(123,108,246,.2);box-shadow:inset 0 0 0 1.5px #7B6CF6;color:#F4F4F6}
.dc{height:44px;border:0;background:transparent;padding:0;display:flex;align-items:center;justify-content:center}
.dc span{width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500;color:#F4F4F6;transition:background-color .2s ease,color .2s ease,transform .12s ease}
.dc:active span{transform:scale(.9)}
.dc.today span{box-shadow:inset 0 0 0 1.5px #4A4A54}
.dc.on span{background:linear-gradient(180deg,#6F5EF0,#5240D9);box-shadow:inset 0 1px 0 rgba(255,255,255,.16);color:#FFFFFF;font-weight:600;animation:pick .32s cubic-bezier(.2,.8,.2,1)}
.dc:disabled{cursor:default}
.dc:disabled span{color:#3A3A42;transform:none}
.dc.blank{visibility:hidden}
@keyframes pick{40%{transform:scale(1.12)}}
.gL1{animation:gL1 .3s cubic-bezier(.2,.8,.2,1) both}
.gL2{animation:gL2 .3s cubic-bezier(.2,.8,.2,1) both}
.gR1{animation:gR1 .3s cubic-bezier(.2,.8,.2,1) both}
.gR2{animation:gR2 .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes gL1{from{opacity:0;transform:translateX(-28px)}}
@keyframes gL2{from{opacity:0;transform:translateX(-28px)}}
@keyframes gR1{from{opacity:0;transform:translateX(28px)}}
@keyframes gR2{from{opacity:0;transform:translateX(28px)}}
.cta{height:56px;border:0;border-radius:28px;width:100%;background:linear-gradient(180deg,#6F5EF0,#5240D9);box-shadow:inset 0 1px 0 rgba(255,255,255,.16);color:#FFFFFF;font-size:16px;font-weight:600;transition:transform .12s ease}
.cta:active{transform:scale(.98)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:1ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:1ms!important}}
</style>
</helmet>
<div style="width: 412px; height: 915px; position: relative; overflow: hidden; background: #08080A; color: #F4F4F6; font-family: 'Archivo', system-ui, sans-serif; box-sizing: border-box; padding-top: 36px">

  <header style="height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px">
    <div style="display: flex; align-items: center; gap: 14px">
      <a href="V4-Home.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; background: #141417; color: #F4F4F6; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
      <h1 class="w" style="margin: 0; font-size: 19px; font-weight: 600">New entry</h1>
    </div>
    <a href="V4-Paste.dc.html" style="height: 44px; display: flex; align-items: center; font-size: 14px; font-weight: 500; text-decoration: none">Paste text instead</a>
  </header>

  <div style="position: relative; display: flex; padding: 0 20px; box-shadow: inset 0 -1px 0 #1A1A1F">
    <span class="tab on" style="display: flex; align-items: center; justify-content: center">Expense</span>
    <span class="tab" style="display: flex; align-items: center; justify-content: center">Income</span>
    <span aria-hidden="true" style="position: absolute; left: 20px; bottom: 0; width: 96px; height: 2px; border-radius: 2px; background: #7B6CF6"></span>
  </div>

  <div style="height: 172px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
    <span style="font-size: 13px; color: #8A8A95">Amount</span>
    <div class="w n" style="display: flex; align-items: center; gap: 4px; font-size: 64px; font-weight: 600; letter-spacing: -0.02em; line-height: 1">
      <span style="font-size: 34px; font-weight: 500; color: #8A8A95; align-self: flex-start; margin-top: 6px">₹</span>486
    </div>
  </div>

  <div style="display: flex; gap: 8px; padding: 0 20px; overflow: hidden">
    <span class="cc on"><i style="color: #F2A272"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 21V3c-2 1.5-3 4-3 7h3"></path></svg></i>Food &amp; Dining</span>
    <span class="cc"><i style="color: #5CD3C6"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 16V11l2-5h10l2 5v5M3 16h18v3H3zM5 11h14"></path></svg></i>Transportation</span>
    <span class="cc"><i style="color: #6FB2FF"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg></i>Utilities</span>
  </div>

  <div style="margin: 14px 20px 0; border-radius: 20px; background: #111114; overflow: hidden">
    <a class="dr" href="V4-Suggest.dc.html">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8A95" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>
      <span style="flex: 1; font-size: 15px; font-weight: 500">Swiggy dinner</span>
      <span style="font-size: 12px; color: #8A8A95">Used 12 times</span>
    </a>
    <button class="dr {{rowFlash}}" onClick="{{reopen}}" aria-label="Date, {{rowText}}. Change date">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8A95" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"></rect><path d="M8 3v4M16 3v4M3.5 10h17"></path></svg>
      <span style="flex: 1; font-size: 15px; font-weight: 500">{{rowText}}</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8A95" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
    </button>
  </div>

  <div class="w" aria-hidden="true" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px 12px; padding: 12px 28px 0">
    <span class="k">1</span><span class="k">2</span><span class="k">3</span>
    <span class="k">4</span><span class="k">5</span><span class="k">6</span>
    <span class="k">7</span><span class="k">8</span><span class="k">9</span>
    <span class="k" style="font-size: 20px">00</span><span class="k">0</span><span class="k"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7z"></path><path d="m12 9.5 5 5M17 9.5l-5 5"></path></svg></span>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 24px">
    <a href="V4-Capture.dc.html" style="height: 56px; border-radius: 28px; background: linear-gradient(180deg, #6F5EF0, #5240D9); box-shadow: inset 0 1px 0 rgba(255,255,255,.16); color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; text-decoration: none">Record ₹486 expense</a>
  </div>

  <sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
    <div class="{{scrimClass}}" onClick="{{close}}" style="position: absolute; inset: 0; background: rgba(0,0,0,.6)"></div>
    <section class="{{sheetClass}}" role="dialog" aria-modal="true" aria-labelledby="date-title" style="position: absolute; left: 0; right: 0; bottom: 0; background: #111114; border-radius: 32px 32px 0 0; box-shadow: inset 0 1px 0 rgba(255,255,255,.06); padding: 12px 20px 28px">
      <div style="width: 40px; height: 4px; border-radius: 2px; background: #2A2A31; margin: 0 auto 18px"></div>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px">
        <h2 id="date-title" class="w" style="margin: 0; font-size: 20px; font-weight: 600">Pick a date</h2>
        <div style="display: flex; gap: 8px">
          <button class="{{todayChip}}" aria-pressed="{{isToday}}" onClick="{{pickToday}}">Today</button>
          <button class="{{yestChip}}" aria-pressed="{{isYest}}" onClick="{{pickYest}}">Yesterday</button>
        </div>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 16px">
        <button class="ib" aria-label="Previous month" disabled="{{prevDis}}" onClick="{{prevMonth}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
        <span class="w {{gridClass}}" aria-live="polite" style="font-size: 17px; font-weight: 600">{{viewTitle}}</span>
        <button class="ib" aria-label="Next month" disabled="{{nextDis}}" onClick="{{nextMonth}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
      </div>
      <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); height: 28px; align-items: center; margin-top: 8px; text-align: center; font-size: 12px; color: #8A8A95"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>
      <div class="{{gridClass}}" role="group" aria-label="{{viewTitle}}" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 2px">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="42">
          <button class="{{c.cls}}" aria-label="{{c.aria}}" aria-pressed="{{c.on}}" disabled="{{c.dis}}" onClick="{{c.pick}}"><span class="n">{{c.label}}</span></button>
        </sc-for>
      </div>
      <button class="cta" onClick="{{confirm}}" style="margin-top: 16px">{{ctaLabel}}</button>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":412,"height":915}}'>
class Component extends DCLogic {
  componentWillUnmount() {
    if (this.t1) { clearTimeout(this.t1); }
  }
  renderVals() {
    var self = this;
    var s = this.state || {};
    var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    var SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    var TODAY = { y: 2026, m: 9, d: 21 };
    var open = s.open === undefined ? true : s.open;
    var closing = !!s.closing;
    var sel = s.sel || TODAY;
    var used = s.used || TODAY;
    var view = s.view || { y: sel.y, m: sel.m };
    var same = function (a, b) { return a.y === b.y && a.m === b.m && a.d === b.d; };
    var YEST = { y: 2026, m: 9, d: 20 };
    var dayName = function (p) { return DAYS[new Date(p.y, p.m, p.d).getDay()]; };
    var label = function (p) {
      var base = dayName(p) + ' ' + p.d + ' ' + SHORT[p.m] + (p.y !== TODAY.y ? ' ' + p.y : '');
      if (same(p, TODAY)) { return 'Today, ' + base; }
      if (same(p, YEST)) { return 'Yesterday, ' + base; }
      return base;
    };
    var first = new Date(view.y, view.m, 1).getDay();
    var count = new Date(view.y, view.m + 1, 0).getDate();
    var cells = [];
    var i;
    for (i = 0; i < first; i++) { cells.push({ label: '', cls: 'dc blank', aria: '', on: false, dis: true, tab: -1, pick: null }); }
    for (i = 1; i <= count; i++) {
      (function (d) {
        var p = { y: view.y, m: view.m, d: d };
        var after = view.y > TODAY.y || (view.y === TODAY.y && (view.m > TODAY.m || (view.m === TODAY.m && d > TODAY.d)));
        var on = same(p, sel);
        cells.push({
          label: String(d),
          cls: 'dc' + (on ? ' on' : '') + (same(p, TODAY) && !on ? ' today' : ''),
          aria: dayName(p) + ' ' + d + ' ' + MONTHS[view.m] + ' ' + view.y + (after ? ', not yet' : ''),
          on: on,
          dis: after,
          tab: 0,
          pick: after ? null : function () { self.setState({ sel: p }); }
        });
      })(i);
    }
    while (cells.length < 42) { cells.push({ label: '', cls: 'dc blank', aria: '', on: false, dis: true, tab: -1, pick: null }); }
    var go = function (d) {
      return function () {
        var m = view.m + d;
        var y = view.y;
        if (m < 0) { m = 11; y--; }
        if (m > 11) { m = 0; y++; }
        if (y < 2025 || y > TODAY.y || (y === TODAY.y && m > TODAY.m)) { return; }
        self.setState({ view: { y: y, m: m }, dir: d, gflip: !s.gflip });
      };
    };
    var hide = function (apply) {
      if (self.t1) { clearTimeout(self.t1); }
      self.setState({ closing: true });
      self.t1 = setTimeout(function () {
        var st = self.state || {};
        var next = { open: false, closing: false };
        if (apply) { next.used = st.sel || TODAY; next.flash = !st.flash; }
        self.setState(next);
      }, 260);
    };
    var gridClass = '';
    if (s.dir !== undefined) { gridClass = s.dir < 0 ? (s.gflip ? 'gL1' : 'gL2') : (s.gflip ? 'gR1' : 'gR2'); }
    var ctaBase = same(sel, TODAY) ? 'today, ' + sel.d + ' ' + SHORT[sel.m] : (same(sel, YEST) ? 'yesterday, ' + sel.d + ' ' + SHORT[sel.m] : dayName(sel) + ' ' + sel.d + ' ' + SHORT[sel.m] + (sel.y !== TODAY.y ? ' ' + sel.y : ''));
    return {
      open: open,
      scrimClass: closing ? 'scrim out' : 'scrim',
      sheetClass: closing ? 'sheet out' : 'sheet',
      close: function () { if (!closing) { hide(false); } },
      confirm: function () { if (!closing) { hide(true); } },
      reopen: function () {
        if (self.t1) { clearTimeout(self.t1); }
        self.setState({ open: true, closing: false, sel: used, view: { y: used.y, m: used.m }, dir: undefined });
      },
      rowText: label(used),
      rowFlash: s.flash === undefined ? '' : (s.flash ? 'fA' : 'fB'),
      isToday: same(sel, TODAY),
      isYest: same(sel, YEST),
      todayChip: same(sel, TODAY) ? 'qc on' : 'qc',
      yestChip: same(sel, YEST) ? 'qc on' : 'qc',
      pickToday: function () { self.setState({ sel: TODAY, view: { y: 2026, m: 9 } }); },
      pickYest: function () { self.setState({ sel: YEST, view: { y: 2026, m: 9 } }); },
      viewTitle: MONTHS[view.m] + ' ' + view.y,
      prevDis: view.y === 2025 && view.m === 0,
      nextDis: view.y === TODAY.y && view.m === TODAY.m,
      prevMonth: go(-1),
      nextMonth: go(1),
      gridClass: gridClass,
      cells: cells,
      ctaLabel: 'Use ' + ctaBase
    };
  }
}
</script>
</body>
</html>
